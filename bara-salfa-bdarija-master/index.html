<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>برا السالفة بالدارجة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23F6EFE2'/><path d='M50 6 L59 41 L94 50 L59 59 L50 94 L41 59 L6 50 L41 41 Z' fill='none' stroke='%23F2B23D' stroke-width='5'/><text x='50' y='72' font-size='50' text-anchor='middle'>🕵️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─────────────────────────────────────────────── */
:root{
  --paper:#F6EFE2;
  --paper2:#EDE2C9;
  --card:#FFF9EC;
  --ink:#2A2118;
  --ink50:rgba(42,33,24,.55);
  --ink35:rgba(42,33,24,.3);
  --ink15:rgba(42,33,24,.15);
  --terra:#C8412B;
  --terra2:#E85C2A;
  --saffron:#F2B23D;
  --tea:#1F7A6B;
  --mint:#3FBA9A;
  --chalk:#3A2E22;
  --dim:#8A7A63;
  --r:18px;
  --shadow:0 4px 0 var(--ink);
  --shadow-sm:0 3px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{
  background:var(--paper);
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><g fill="none" stroke="%232A2118" stroke-opacity=".06" stroke-width="1.6"><path d="M48 14 L55 41 L82 48 L55 55 L48 82 L41 55 L14 48 L41 41 Z"/><circle cx="48" cy="48" r="6"/><path d="M0 20 L16 14 M96 20 L80 14 M0 76 L16 82 M96 76 L80 82"/><path d="M20 0 L14 16 M76 0 L82 16 M20 96 L14 80 M76 96 L82 80"/></g></svg>');
  background-size:96px 96px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  color:var(--chalk);
  font-family:'Cairo',system-ui,sans-serif;
  display:flex;justify-content:center;
  overscroll-behavior:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
body::before,body::after{
  content:'';position:fixed;z-index:0;pointer-events:none;
  border:2.5px solid var(--ink);
}
body::before{
  width:190px;height:190px;top:-80px;left:-80px;
  background:linear-gradient(135deg,rgba(242,178,61,.9),rgba(242,178,61,.5));
  border-radius:40% 60% 55% 45%;
  transform:rotate(14deg);
}
body::after{
  width:150px;height:150px;bottom:-70px;right:-60px;
  background:linear-gradient(135deg,rgba(63,186,154,.7),rgba(63,186,154,.28));
  border-radius:58% 42% 60% 40%;
  transform:rotate(-16deg);
}
#app{
  width:100%;max-width:460px;min-height:100dvh;
  display:flex;flex-direction:column;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  position:relative;z-index:1;
}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;animation:screenIn .5s cubic-bezier(.22,1,.36,1) both}
.screen.same{animation:softIn .22s ease both}
.screen.same .anim-fadeup,
.screen.same .anim-pop,
.screen.same .anim-shake{animation:none!important}
.spacer{flex:1}

/* ─── TYPOGRAPHY ─────────────────────────────────────────── */
h1{font-family:'Lalezar','Cairo',sans-serif;font-size:clamp(40px,13vw,60px);font-weight:400;line-height:1;letter-spacing:0}
h2{font-family:'Lalezar','Cairo',sans-serif;font-size:30px;font-weight:400;line-height:1.1}
h3{font-size:17px;font-weight:800}
p{font-size:15px;line-height:1.65;color:var(--dim)}
.lead{color:var(--chalk)}
.sm{font-size:13px}
.cat-pill{display:inline-block;font-size:12px;font-weight:900;background:var(--saffron);color:var(--ink);border:2.5px solid var(--ink);border-radius:99px;padding:2px 12px;transform:rotate(-1deg);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ─── DECORATIONS ────────────────────────────────────────── */
.zig{
  height:12px;border-radius:2px;
  background-image:linear-gradient(96deg,var(--terra2) 0 30%,var(--ink) 30% 36%,var(--terra) 36% 66%,var(--saffron) 66% 100%);
  background-size:26px 12px;background-repeat:repeat-x;
  transform:rotate(-.5deg);opacity:.9;
}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim);font-weight:800;padding:2px 4px;gap:8px}
.bar b{color:var(--terra);font-weight:900}
.tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;
  padding:5px 14px;border-radius:99px;
  background:var(--saffron);color:var(--ink);
  border:2.5px solid var(--ink);box-shadow:var(--shadow-sm);
  transform:rotate(-2deg);
}

/* ─── BUTTONS ────────────────────────────────────────────── */
button{
  font-family:inherit;font-size:17px;font-weight:800;
  border:3px solid var(--ink);border-radius:16px;padding:15px 20px;
  cursor:pointer;width:100%;
  background:var(--paper2);color:var(--ink);
  box-shadow:var(--shadow);
  transition:transform .12s,box-shadow .12s,background .15s;
  position:relative;overflow:hidden;
}
button::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(-45deg,rgba(255,255,255,.14) 0 6px,transparent 6px 12px);
  opacity:.4;pointer-events:none;mix-blend-mode:overlay;
}
button:hover{transform:translateY(-2px)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--terra);outline-offset:3px}
button[disabled]{opacity:.35;cursor:not-allowed;transform:none;box-shadow:0 2px 0 var(--ink)}

.btn-primary{
  background:linear-gradient(135deg,var(--tea),var(--mint));
  color:var(--paper);
}
.btn-cta{
  background:linear-gradient(135deg,var(--terra) 0%,var(--terra2) 55%,var(--saffron) 140%);
  color:var(--paper);
  font-size:20px;font-weight:900;letter-spacing:.5px;
  padding:18px 20px;
  animation:nudge 2.4s ease-in-out infinite;
}
.btn-ghost{background:var(--card);color:var(--ink)}
.btn-ghost:hover{background:var(--paper2)}
.btn-sm{font-size:14px;padding:11px 14px}
.row{display:flex;gap:10px}
.row button{flex:1}

/* ─── INPUTS ─────────────────────────────────────────────── */
input{
  width:100%;font-family:inherit;font-size:17px;font-weight:700;
  padding:13px 16px;border-radius:14px;
  border:2.5px dashed var(--ink50);
  background:var(--card);color:var(--ink);
  transition:border-color .15s,box-shadow .15s;
}
input:focus{outline:0;border-style:solid;border-color:var(--tea);box-shadow:0 3px 0 var(--ink)}
input::placeholder{color:var(--dim);font-weight:600}

/* ─── CARDS / PICKS ──────────────────────────────────────── */
.card{
  background:var(--card);border:3px solid var(--ink);
  border-radius:var(--r);padding:18px;
  box-shadow:var(--shadow-sm);
}
.pick{
  width:100%;text-align:right;
  background:var(--card);border:2.5px solid var(--ink50);
  border-radius:14px;padding:14px 16px;
  color:var(--ink);font-size:16px;font-weight:800;
  cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s,transform .12s;
  margin-bottom:8px;
}
.pick:hover{border-color:var(--ink);transform:translateY(-2px)}
.pick.on{border-color:var(--terra);background:#FFF1DC;box-shadow:3px 3px 0 var(--terra)}
.pick .sub{display:block;font-size:12px;font-weight:700;color:var(--dim);margin-top:3px}

/* ─── COUNT CHIPS ────────────────────────────────────────── */
.count-row{display:flex;gap:8px;justify-content:center}
.count-chip{
  flex:1;max-width:52px;height:48px;padding:0;
  font-size:20px;font-weight:900;border-radius:12px;
  background:var(--card);border:2.5px solid var(--ink);
  box-shadow:0 3px 0 var(--ink);color:var(--ink);
  display:grid;place-items:center;
  transition:transform .1s,box-shadow .1s,background .15s;
}
.count-chip:hover{transform:translateY(-2px)}
.count-chip:active{transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
.count-chip.on{background:var(--terra);color:var(--paper);box-shadow:3px 3px 0 var(--ink)}
.count-chip.count-more{font-size:24px;line-height:0;letter-spacing:1px;animation:morePulse 1.3s ease-in-out infinite}
@keyframes morePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}

/* ─── COUNT TYPER ────────────────────────────────────────── */
.count-typer{display:flex;align-items:center;justify-content:center;gap:10px}
.count-input{
  width:82px;text-align:center;
  font-size:30px;font-weight:900;
  padding:8px 10px;border-radius:16px;
  border:2.5px solid var(--ink);
  background:var(--card);color:var(--terra);
  -moz-appearance:textfield;
  animation:countGlow 1.7s ease-in-out infinite;
}
.count-input::-webkit-outer-spin-button,
.count-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.count-input:focus{outline:0;border-color:var(--terra);animation:none;box-shadow:0 3px 0 var(--ink)}
.count-unit{font-size:15px;font-weight:900;color:var(--dim)}
.count-hint{
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12px;font-weight:800;color:var(--terra);margin-top:2px;
}
.count-hint .wag{display:inline-block;animation:hintWiggle 1.4s ease-in-out infinite}
@keyframes countGlow{
  0%,100%{box-shadow:0 3px 0 var(--ink),0 0 0 0 rgba(200,65,43,0)}
  50%{box-shadow:0 3px 0 var(--ink),0 0 0 9px rgba(200,65,43,.16)}
}

/* ─── HOLD-TO-REVEAL ─────────────────────────────────────── */
.hold{
  position:relative;flex:1;min-height:280px;
  border-radius:24px;border:3px dashed var(--ink50);
  background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:26px;
  touch-action:none;user-select:none;
  transition:border-color .25s,background .25s;
  box-shadow:var(--shadow-sm);
}
.hold.live{border-style:solid;border-color:var(--terra);background:#FFF1DC}
.hold .hint{font-size:15px;font-weight:800;color:var(--dim)}
.hold .veil{display:flex;flex-direction:column;align-items:center;gap:12px}
.ring{
  width:88px;height:88px;border-radius:50%;
  background:conic-gradient(var(--saffron) calc(var(--p)*1%),var(--ink15) 0);
  display:grid;place-items:center;
  border:3px solid var(--ink);
  transition:none;
}
.ring-inner{width:64px;height:64px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:28px;border:2px solid var(--ink)}
.secret{display:none}
.hold.live .secret{display:block;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.hold.live .veil{display:none}
.role-badge{
  font-size:13px;font-weight:900;letter-spacing:1px;
  padding:6px 16px;border-radius:10px;margin-bottom:6px;
  display:inline-block;
  border:2.5px solid var(--ink);box-shadow:var(--shadow-sm);
  transform:rotate(-2deg);
}
.role-intrus{background:#FFD9C7;color:var(--terra)}
.role-safe{background:#D8F0E4;color:var(--tea)}
.word-reveal{
  font-family:'Lalezar','Cairo',sans-serif;
  font-size:clamp(42px,12vw,58px);font-weight:400;
  margin:8px 0 10px;line-height:1.05;
  color:var(--ink);
  background:linear-gradient(180deg,rgba(242,178,61,.5),rgba(242,178,61,.22));
  padding:2px 18px;border-radius:10px;
  transform:rotate(-1deg);
  text-shadow:2px 2px 0 rgba(255,255,255,.65);
}
.mission-txt{font-size:15px;font-weight:800;color:var(--tea);line-height:1.6;
  background:var(--paper2);border:2.5px solid var(--tea);
  border-radius:12px;padding:12px;margin-top:8px;
  box-shadow:3px 3px 0 rgba(31,122,107,.3);
  text-align:right;}

/* ─── TABLE ──────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse}
td{padding:12px 4px;border-bottom:2.5px dashed var(--ink15);font-weight:800;font-size:16px;color:var(--ink)}
td.pts{text-align:left;color:var(--terra);font-weight:900;font-variant-numeric:tabular-nums;font-size:18px}
tr.winner td:first-child::before{content:'🥇 '}
tr.winner td{animation:winnerBob 1.4s ease-in-out infinite}
tr.me td{color:var(--terra)}

/* ─── ANIMATIONS ─────────────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px) rotate(-.4deg)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.82) rotate(-1.2deg);opacity:0}65%{transform:scale(1.04) rotate(.4deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
@keyframes countPulse{0%{transform:scale(1)}50%{transform:scale(1.35);color:var(--terra)}100%{transform:scale(1)}}
@keyframes screenIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes softIn{from{opacity:.4}to{opacity:1}}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes nudge{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-3px) rotate(.6deg)}}
@keyframes stampIn{0%{opacity:0;transform:scale(1.7) rotate(-8deg)}60%{transform:scale(.9) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(1.4deg)}}
@keyframes titleBob{0%,100%{transform:rotate(-.6deg) translateY(0)}50%{transform:rotate(.6deg) translateY(-4px)}}
@keyframes winnerBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px) scale(1.02)}}
@keyframes orbFloat{0%,100%{transform:translate(0,0) rotate(0) scale(1)}30%{transform:translate(-24px,20px) rotate(6deg) scale(1.06)}70%{transform:translate(18px,-14px) rotate(-6deg) scale(.94)}}

.anim-fadeup{animation:fadeUp .45s cubic-bezier(.22,1,.36,1) both}
.anim-pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1) both}
.anim-shake{animation:shake .5s ease}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}.d5{animation-delay:.3s}

/* ─── HOME SCREEN ────────────────────────────────────────── */
.home-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  overflow:hidden;
}
/* painted blobs */
.home-orb{position:absolute;border-radius:44% 56% 50% 50%;pointer-events:none}
.home-orb-1{
  width:330px;height:330px;
  background:radial-gradient(circle,rgba(200,65,43,.5) 0%,rgba(200,65,43,0) 66%);
  top:-120px;right:-120px;
  animation:orbFloat 10s ease-in-out infinite;
  filter:blur(30px);
}
.home-orb-2{
  width:260px;height:260px;
  background:radial-gradient(circle,rgba(242,178,61,.5) 0%,rgba(242,178,61,0) 66%);
  bottom:40px;left:-110px;
  animation:orbFloat 13s ease-in-out infinite reverse;
  filter:blur(28px);
}
.home-orb-3{
  width:200px;height:200px;
  background:radial-gradient(circle,rgba(63,186,154,.4) 0%,rgba(63,186,154,0) 66%);
  top:40%;right:-40px;
  animation:orbFloat 9s ease-in-out infinite 2s;
  filter:blur(24px);
}
/* ticket marquee */
.ticker{
  margin:2px 0 4px;position:relative;overflow:hidden;
  background:var(--ink);color:var(--paper);
  font-size:13px;font-weight:800;letter-spacing:.5px;
  padding:9px 0;border:2.5px solid var(--ink);
  border-radius:10px;box-shadow:var(--shadow-sm);
}
.ticker .track{display:inline-block;white-space:nowrap;padding:0 8px;animation:marq 26s linear infinite;will-change:transform}
/* hero */
.hero{display:flex;flex-direction:column;align-items:center}
.home-mascot-wrap{position:relative;display:inline-block;margin-bottom:10px}
.star8{
  position:absolute;inset:-44px;margin:auto;width:150px;height:150px;
  animation:spin 16s linear infinite;
  filter:drop-shadow(2px 2px 0 rgba(42,33,24,.18));
}
.tape{
  position:absolute;z-index:2;
  background:rgba(242,178,61,.85);
  border:2px solid var(--ink);border-radius:4px;
  top:10px;right:-14px;width:64px;height:16px;
  transform:rotate(7deg);
}
.home-mascot-emoji{
  font-size:64px;display:block;position:relative;z-index:1;
  background:var(--card);border:3px solid var(--ink);border-radius:16px;
  padding:12px;line-height:1;
  box-shadow:var(--shadow);
  transform:rotate(-3deg);
  animation:float 3.6s ease-in-out infinite;
}
/* title — two stacked lines */
.home-title-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.home-title-bara{
  font-family:'Lalezar','Cairo',sans-serif;
  font-size:clamp(46px,13.5vw,64px);line-height:1;
  color:var(--terra);
  padding:0 18px;
  position:relative;
  text-shadow:2px 2px 0 var(--saffron),4px 4px 0 var(--ink);
}
/* hand-drawn squiggle underline */
.home-title-bara::after{
  content:'';position:absolute;left:8px;right:8px;bottom:2px;height:10px;
  background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="12" viewBox="0 0 120 12"><path d="M2 8 Q10 2 20 6 T40 7 T60 5 T80 7 T100 5 T118 7" fill="none" stroke="%23F2B23D" stroke-width="5" stroke-linecap="round"/></svg>') repeat-x bottom;
  background-size:120px 12px;
}
.home-title-salfa{
  font-family:'Lalezar','Cairo',sans-serif;
  display:block;
  font-size:clamp(72px,20vw,100px);line-height:.92;
  color:var(--ink);
  text-shadow:4px 4px 0 var(--saffron);
  animation:titleBob 3.5s ease-in-out infinite;
}
.home-darija-badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:clamp(12px,3.4vw,15px);font-weight:900;
  margin-top:12px;
  padding:7px 20px;border-radius:8px;
  background:var(--terra);color:var(--paper);
  border:3px solid var(--ink);box-shadow:var(--shadow-sm);
  transform:rotate(1.4deg);
  animation:stampIn .55s cubic-bezier(.22,1,.36,1) both;
}
.home-tagline{
  font-size:clamp(13px,3.8vw,16px);
  color:var(--dim);font-weight:700;margin-top:12px;letter-spacing:.2px;
}
/* feature stickers */
.home-feats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.home-feat{
  background:var(--card);
  border:2.5px solid var(--ink);
  border-radius:12px;padding:12px 6px;
  text-align:center;box-shadow:var(--shadow-sm);
  transition:transform .12s;
}
.home-feat:hover{transform:translateY(-2px)}
.home-feat:nth-child(2){transform:rotate(1deg)}
.home-feat:nth-child(3){transform:rotate(-1.2deg)}
.home-feat:active{transform:translateY(2px)}
.home-feat-ico{font-size:24px;display:block;margin-bottom:5px}
.home-feat-lbl{font-size:11px;font-weight:800;color:var(--dim);line-height:1.4;display:block}
.link{color:var(--terra);font-weight:900;text-decoration:underline wavy 2px var(--saffron);cursor:pointer;display:inline;background:none;border:0;padding:0;box-shadow:none;font-family:inherit}

/* ─── HOW-TO ─────────────────────────────────────────────── */
.step{
  display:flex;gap:14px;align-items:flex-start;
  background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:13px 14px;
  box-shadow:var(--shadow-sm);
}
.step:nth-child(even){transform:rotate(.4deg)}
.step:nth-child(odd){transform:rotate(-.4deg)}
.step-num{
  min-width:34px;height:34px;border-radius:9px;
  background:var(--saffron);color:var(--ink);
  display:grid;place-items:center;
  font-size:16px;font-weight:900;border:2.5px solid var(--ink);
  box-shadow:2px 2px 0 var(--ink);flex-shrink:0;
  transform:rotate(-3deg);
}

/* ─── TIMER ──────────────────────────────────────────────── */
.clock-big{
  font-size:clamp(72px,22vw,100px);font-weight:900;
  text-align:center;font-variant-numeric:tabular-nums;
  color:var(--ink);text-shadow:3px 3px 0 var(--saffron);
  transition:color .3s;
}
.clock-big.low{color:var(--terra);animation:pulse 1s infinite}
.clock-sm{font-size:15px;font-variant-numeric:tabular-nums;color:var(--dim);font-weight:800}
.clock-sm.low{color:var(--terra);font-weight:900}

/* ─── RESULT ─────────────────────────────────────────────── */
.result-banner{
  border-radius:20px;padding:22px;text-align:center;
  border:3px solid var(--ink);box-shadow:var(--shadow);
  position:relative;
}
.result-banner::after{
  content:'';position:absolute;top:8px;right:14px;
  width:18px;height:18px;border-radius:4px;
  background:var(--saffron);border:2px solid var(--ink);transform:rotate(12deg);
}
.result-caught{background:#E2F4E8;border-color:var(--tea)}
.result-escaped{background:#FFE6DA;border-color:var(--terra)}

/* ─── FOOTBALL THEME ────────────────────────────────────── */
.football-edition{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:900;letter-spacing:.5px;
  padding:4px 12px;border-radius:99px;margin-bottom:6px;
  background:#E2F4E8;color:var(--tea);
  border:2px solid var(--tea);
}
.word-football{color:var(--tea);background:linear-gradient(180deg,rgba(63,186,154,.5),rgba(63,186,154,.22))}
.word-outsider-football{
  color:var(--terra);
  font-size:clamp(28px,7vw,40px)!important;
  line-height:1.25;
}
.football-cat-btn{border-color:var(--tea)!important}
.football-cat-btn.on{border-color:var(--tea)!important;background:#E2F4E8!important}

/* ─── CONFETTI ───────────────────────────────────────────── */
.confetti-piece{
  position:fixed;top:-20px;
  width:10px;height:14px;border-radius:3px;
  pointer-events:none;z-index:9999;
  animation:confettiFall linear both;
}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ─── CATEGORY SLIDER (slides) ───────────────────────────── */
.cat-carousel{position:relative}
.cat-slider{
  display:flex;gap:8px;overflow-x:auto;
  padding:6px 2px 14px;
  scroll-snap-type:x proximity;
  scroll-snap-stop:always;
  scrollbar-width:none;
  overscroll-behavior-x:contain;
  cursor:grab;
  -webkit-user-select:none;user-select:none;
}
.cat-slider.dragging{cursor:grabbing;scroll-snap-type:none}
.cat-slider::-webkit-scrollbar{display:none}
.cat-slide{
  flex:0 0 calc((100% - 18px)/3.5);
  scroll-snap-align:start;
  position:relative;min-height:158px;
  text-align:center;
  background:var(--card);border:2.5px solid var(--ink);
  border-radius:16px;padding:20px 8px 12px;
  color:var(--ink);font-size:14px;font-weight:800;
  cursor:pointer;
  transition:transform .12s,box-shadow .12s,background .15s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  line-height:1.3;box-shadow:0 3px 0 var(--ink);
}
.cat-slide:hover{transform:translateY(-2px)}
.cat-slide:active{transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
.cat-slide.on{background:#FFF1DC;box-shadow:3px 3px 0 var(--terra);border-color:var(--terra)}
.cat-slide.football-card.on{box-shadow:3px 3px 0 var(--tea);border-color:var(--tea);background:#E2F4E8}
.cat-slide .slide-n{
  position:absolute;top:7px;inset-inline-start:8px;
  font-size:10px;font-weight:900;color:var(--dim);
  background:var(--paper2);border:1.5px solid var(--ink35);border-radius:99px;
  padding:1px 7px;
}
.cat-slide .cat-emoji{font-size:36px;line-height:1;margin-top:8px}
.cat-slide .cat-name{font-size:14px}
.slide-hint{
  display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:12px;font-weight:800;color:var(--dim);
  margin:-4px 0 2px;transition:opacity .4s;
}
.slide-hint .wiggle{display:inline-block;animation:hintWiggle 1.6s ease-in-out infinite}
.slide-hint.done{opacity:0;pointer-events:none}
@keyframes hintWiggle{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
.slide-arrow{
  position:absolute;top:94px;transform:translateY(-50%);
  width:34px;height:34px;padding:0;border-radius:50%;
  background:var(--paper);color:var(--ink);
  border:2.5px solid var(--ink);box-shadow:var(--shadow-sm);
  font-size:18px;font-weight:900;display:grid;place-items:center;z-index:3;
}
.slide-arrow:active{transform:translateY(-50%) translateY(2px);box-shadow:0 1px 0 var(--ink)}
.sa-prev{inset-inline-start:-4px}
.sa-next{inset-inline-end:-4px}

/* ─── PROGRESS BAR ──────────────────────────────────────── */
.prog-bar{
  height:8px;border-radius:4px;background:var(--ink15);
  border:2px solid var(--ink);overflow:hidden;
}
.prog-fill{
  height:100%;border-radius:2px;
  background:repeating-linear-gradient(-45deg,var(--terra) 0 10px,var(--terra2) 10px 20px);
  transition:width .3s;
}

/* ─── TIE NOTICE ─────────────────────────────────────────── */
.tie-notice{
  background:#FFF1DC;border:2.5px solid var(--saffron);
  border-radius:14px;padding:14px;text-align:center;
  box-shadow:var(--shadow-sm);transform:rotate(-.4deg);
}

/* ─── QUIT BUTTON ────────────────────────────────────────── */
.quit-btn{
  position:fixed;top:14px;left:14px;
  width:36px;height:36px;padding:0;
  border-radius:50%;
  background:var(--paper);
  border:2.5px solid var(--ink);
  color:var(--ink);font-size:15px;
  display:grid;place-items:center;
  z-index:100;cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:transform .12s;
  font-family:inherit;
}
.quit-btn:hover{transform:translateY(-2px)}
.quit-btn:focus-visible{outline:3px solid var(--terra);outline-offset:3px}

/* ─── MODAL ──────────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(42,33,24,.5);
  z-index:200;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  backdrop-filter:blur(2px);
  animation:fadeIn .2s ease both;
}
.modal-overlay[hidden]{display:none}
.modal-box{
  background:var(--card);
  border:3px solid var(--ink);
  border-radius:18px;
  padding:26px 22px;
  width:100%;max-width:360px;
  text-align:center;
  box-shadow:6px 6px 0 rgba(42,33,24,.35);
}
.modal-box h2{font-size:22px;font-family:'Lalezar','Cairo',sans-serif;font-weight:400;margin-bottom:8px;color:var(--ink)}
.modal-box p{font-size:14px;margin-bottom:20px;color:var(--dim);line-height:1.6}
</style>
</head>

/* ══════════════════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════════════════ */
const norm = s => (s||'').toString().trim().toLowerCase()
  .replace(/[ً-ْـ]/g,'')
  .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
  .replace(/^ال/,'').replace(/\s+/g,' ');

const pick   = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => {
  const x=[...a];
  for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}
  return x;
};
const fmt = s => Math.floor(Math.max(0,s)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ══════════════════════════════════════════════════════════
   ENGINE
══════════════════════════════════════════════════════════ */
function chooseIntrus(){
  const recent = S.intrusHistory.slice(-2);
  let pool = S.players.filter(p=>!recent.includes(p));
  if(!pool.length) pool = S.players.filter(p=>p!==S.intrusHistory.slice(-1)[0]);
  if(!pool.length) pool = [...S.players];
  return pick(pool);
}

function drawChaos(){
  const last2 = S.chaosHistory.slice(-2);
  let pool = CHAOS.filter(c=>!c.mp||S.players.length>=c.mp);
  if(last2.length===2 && last2.every(b=>b==='intrus')) pool = pool.filter(c=>c.b!=='intrus');
  const c = pick(pool);
  S.chaosHistory.push(c.b);
  return c;
}

function newRound(){
  const cat = CATS.find(c=>c.id===S.catId) || pick(CATS);
  const entry = pick(cat.w);
  const [word, close, ok] = entry;
  const intrus = chooseIntrus();
  S.intrusHistory.push(intrus);

  const trio = S.players.length === 3;
  const closeMode = trio ? true : (S.mode!=='classic' && Math.random()<.55);
  const chaos = (S.mode==='hybrid') ? drawChaos() : null;

  let missions = {};
  if(S.mode==='hybrid' && !trio){
    const avail = shuffle(MISSIONS.filter(m=>!chaos||!m.c.includes(chaos.id)));
    S.players.forEach((p,i) => missions[p] = avail[i%avail.length]);
  }

  S.r = {
    cat:cat.n, word, close, ok, intrus, closeMode, chaos, missions, trio,
    football:!!cat.football,
    asker:pick(S.players), lastAsker:null, turns:0, asked:{},
    votes:{}, caught:false, guess:null, judged:{}, tied:[],
  };
  S.idx = 0; S.tieRound = false;
  S.round++;
}

function tallyVotes(votes){
  const t={};
  S.players.forEach(p=>t[p]=0);
  Object.values(votes).forEach(v=>t[v]++);
  const max = Math.max(...Object.values(t));
  return {t, top:S.players.filter(p=>t[p]===max), max};
}

function calcScore(){
  const r=S.r, add={};
  S.players.forEach(p=>add[p]=0);
  // 1pt per regular player who voted correctly
  S.players.filter(p=>p!==r.intrus).forEach(p=>{
    if(r.votes[p]===r.intrus) add[p]=1;
  });
  // 1pt for intrus if they guess correctly (regardless of caught)
  if(r.guess===true) add[r.intrus]=1;
  // Hybrid missions: +1 bonus per completed mission
  Object.entries(r.judged||{}).forEach(([p,ok])=>{ if(ok) add[p]+=1; });
  S.players.forEach(p=>S.scores[p]=(S.scores[p]||0)+add[p]);
  return add;
}

function confetti(count=60){
  const colors=['#FF4500','#FFC43D','#2EFFA8','#FF69B4','#00BFFF','#FFD700'];
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.cssText=`
      left:${Math.random()*100}vw;
      background:${pick(colors)};
      width:${6+Math.random()*10}px;
      height:${10+Math.random()*10}px;
      border-radius:${Math.random()>0.5?'50%':'3px'};
      animation-duration:${2+Math.random()*3}s;
      animation-delay:${Math.random()*.8}s;
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}

let clk=null;
function startClock(sec){
  stopClock(); S.clockLeft=sec; S.clockDone=false;
  const paint=()=>{
    const el=document.getElementById('clock-el'); if(!el)return;
    el.textContent=fmt(S.clockLeft);
    el.className='clock-sm'+(S.clockLeft<=20?' low':'');
  };
  paint();
  clk=setInterval(()=>{
    S.clockLeft--;
    if(S.clockLeft<=0){S.clockLeft=0;S.clockDone=true;stopClock();render();return;}
    paint();
  },1000);
}
function stopClock(){clearInterval(clk);clk=null;}

const GAME_PHASES = new Set(['pass','reveal','chaos','chain','votepass','cast','judge','bonus','result']);

/* shared category slides for setup/config */
function catChips(){
  const lbl=c=>c.n.replace(/^\S+\s/,'');
  const slides=[
    {id:null,  em:'🎲', name:'عشوائي'},
    ...CATS.map(c=>({
      id:c.id,
      em:c.n.match(/\p{Emoji}/u)?.[0]||'🗂️',
      name:lbl(c)
    }))
  ];
  return slides.map((it,i)=>{
    const arg = it.id===null ? 'null' : "'"+it.id+"'";
    const key = it.id===null ? '__all__' : it.id;
    return `
    <button class="cat-slide ${S.catId===it.id?'on':''} ${it.id==='football'?'football-card':''}"
      data-cat="${key}" onclick="act.cat(${arg})">
      <span class="slide-n">${i+1}</span>
      <span class="cat-emoji">${it.em}</span>
      <span class="cat-name">${esc(it.name)}</span>
    </button>`;
  }).join('');
}

function render(){
  const same = S._lastPhase === S.phase;
  S._lastPhase = S.phase;
  const catScroll = S._catScroll;
  const savedInputs = same ? Array.from(app.querySelectorAll('#names input')).map(i=>i.value) : null;
  const oldCars = same ? Array.from(app.querySelectorAll('.cat-carousel')) : null;
  app.innerHTML = `<div class="screen${same?' same':''}">${VIEWS[S.phase]()}</div>`;
  if(same && savedInputs){
    app.querySelectorAll('#names input').forEach((n,i)=>{ if(savedInputs[i]!==undefined) n.value=savedInputs[i]; });
  }
  let keptCar = false;
  if(oldCars && oldCars.length){
    Array.from(app.querySelectorAll('.cat-carousel')).forEach((neu,i)=>{
      const old = oldCars[i];
      if(!old) return;
      old.querySelectorAll('.cat-slide').forEach(s=>{
        const isOn = s.getAttribute('data-cat')===(S.catId===null?'__all__':S.catId);
        s.classList.toggle('on',isOn);
        s.classList.toggle('football-card', isOn && s.getAttribute('data-cat')==='football');
      });
      neu.replaceWith(old);
      keptCar = true;
    });
  }
  if(keptCar){
    if(catScroll!==undefined){
      requestAnimationFrame(()=>{
        const sl=app.querySelector('.cat-slider');
        if(sl && Math.abs(sl.scrollLeft-catScroll)>1) sl.scrollLeft=catScroll;
      });
    }
  } else if(same && catScroll!==undefined){
    const sl=app.querySelector('.cat-slider');
    if(sl) sl.scrollLeft=catScroll;
  }
  if(catScroll!==undefined){
    const h=app.querySelector('.slide-hint');
    if(h) h.classList.add('done');
  }
  bindCarousels();
  if(S.phase==='home') buildHomeBg();
  const af = app.querySelector('[autofocus]'); if(af) af.focus();
  const qb = document.getElementById('quit-btn');
  if(qb) qb.hidden = !GAME_PHASES.has(S.phase);
}

/* ── BONUS GUESS ───────────────────────────────────────────── */
bonus: ()=>{
  const r=S.r;
  if(!r.bonusChoices){
    const cat=CATS.find(c=>c.id===S.catId)||CATS.find(c=>c.n===r.cat);
    const all=cat?cat.w.map(e=>e[0]):[r.word];
    const others=shuffle(all.filter(w=>w!==r.word)).slice(0,4);
    r.bonusChoices=shuffle([r.word,...others]);
  }
  const status=r.caught
    ?`${esc(r.intrus)}، تصابتي 😅 — فرصة أخيرة!`
    :`${esc(r.intrus)}، فلتي 😎 — خمن الكلمة!`;
  return `

},

    return `<tr class="${isIntrus?'me':''}">
      <td>
        ${isIntrus?'🕵️ ':''}${esc(p)}
      </td>
      <td style="font-size:12px;color:var(--dim)">

          ? (r.guess===true?'<span style="color:var(--mint)">خمن ✅</span>':r.guess===false?'<span style="color:var(--dim)">ما خمنش</span>':'')
          : `← ${esc(votedFor)} ${correct?'<span style="color:var(--mint)">✅</span>':'<span style="color:var(--dim)">❌</span>'}`
        }
      </td>
      <td class="pts">+${add[p]}</td>

/* ── SCOREBOARD ────────────────────────────────────────────── */

  return `

  </div>`:''}
  ${done?`
  <div style="text-align:center" class="anim-pop">
    <div style="font-size:52px">🏆</div>
    <h1 style="font-size:32px;margin:6px 0">
      ${esc(sorted[0])} ربح!

    <tr class="${i===0&&done?'winner':''}">
      <td style="font-size:18px">${['🥇','🥈','🥉'][i]||'　'} ${esc(p)}</td>
      <td class="pts">${S.scores[p]} نقطة</td>
    </tr>`).join('')}
  </table>
  <div class="spacer"></div>
  ${done?`
  <button class="btn-cta anim-fadeup d3" onclick="act.newGame()">🎲 لعبة جديدة</button>
  <button class="btn-primary anim-fadeup d4" onclick="act.again()">🔄 نفس اللاعبين — عاود</button>
  <button class="btn-ghost anim-fadeup d5" onclick="go('home')">🏠 الصفحة الرئيسية</button>`
  :`
  <button class="btn-cta anim-fadeup d3" onclick="act.start()">الجولة اللي جاية ⚡</button>
  <button class="btn-ghost anim-fadeup d4" onclick="act.showQuitModal()">🚪 خروج من اللعبة</button>`}`;
},
}; // end VIEWS

/* ══════════════════════════════════════════════════════════
   QUIT MODAL
══════════════════════════════════════════════════════════ */
act.showQuitModal = ()=>{
  const m = document.getElementById('quit-modal');
  m.hidden = false;
  m.querySelector('button').focus();
};
act.hideQuitModal = ()=>{ document.getElementById('quit-modal').hidden = true; };
act.confirmQuit = ()=>{
  stopClock();
  act.hideQuitModal();
  S.phase='home'; S.players=[]; S.mode='classic'; S.catId=null;
  S.round=0; S.intrusHistory=[]; S.chaosHistory=[]; S.scores={};
  S.r=null; S.idx=0; S.tieRound=false; S.clockLeft=0; S.clockDone=false;
  render();
};

/* ══════════════════════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════════════════════ */
act.setup = ()=>{ if(!S.players.length) S.players=['','',''];  go('setup'); };
act.more  = ()=>{ const c=grab(); if(c.length<MAX_PLAYERS){S.players=[...c,'']; render();} };
act.less  = ()=>{ const c=grab(); if(c.length>3){S.players=c.slice(0,-1); render();} };

function grab(){ return Array.from(app.querySelectorAll('#names input')).map(i=>i.value); }

function commitNames(dest){
  const v = grab().map((s,i)=>s.trim()||`لاعب ${i+1}`);
  if(new Set(v).size!==v.length){
    S.nameError='السميات خاصهم يكونو مختلفين 😅'; render(); return false;
  }
  S.nameError='';
  S.players=v;
  S.scores={}; S.players.forEach(p=>S.scores[p]=0);
  if(dest) go(dest);
  return true;
}

/* one-tap start: prefill default names, let them pick count + category */
act.quickStart = ()=>{
  stopClock();
  S.players = ['لاعب 1','لاعب 2','لاعب 3'];
  S.nameError='';
  go('setup');
};

/* player count — names auto-rewrite as لاعب 1..N */
const MAX_PLAYERS = 15;
const clampCount = v => Math.max(3, Math.min(MAX_PLAYERS, parseInt(v,10) || 3));
function setPlayers(n){
  n=clampCount(n);
  S.players = Array.from({length:n},(_,i)=>'لاعب '+(i+1));
  S.nameError='';
  return n;
}
act.count = n=>{
  setPlayers(n);
  S.countInput=false;
  render();
};
act.askCount = ()=>{ S.countInput=true; render(); };
act.setCount = v=>{
  const n=clampCount(v);
  if(S.players.length===n) return;
  setPlayers(n);
  const wrap=document.getElementById('names');
  if(wrap){
    wrap.innerHTML = Array.from({length:n},(_,i)=>
      `<input id="p${i}" placeholder="لاعب ${i+1}" value="${esc(S.players[i])}" maxlength="14"
        oninput="S.nameError=''">`
    ).join('');
  }
};
act.blurCount = el=>{
  const n=clampCount(el.value);
  el.value=n;
  if(S.players.length!==n) act.setCount(n);
};

act.launch = ()=>{
  if(!commitNames()) return;
  S.round=0; S.intrusHistory=[]; S.chaosHistory=[]; S.mode='classic';
  act.start();
};
act.names  = ()=> commitNames('config');
act.mode = m  => { S.mode=m; render(); };
act.cat  = c  => { S.catId=c; render(); };

/* swipe the category carousel by one slide */
act.slideCats = d=>{
  const el=document.querySelector('.cat-slider');
  if(!el) return;
  const card=el.querySelector('.cat-slide');
  const w=(card?card.getBoundingClientRect().width:120)+8;
  el.scrollBy({left:d*w,behavior:'smooth'});
  const h=document.querySelector('.slide-hint');
  if(h) h.classList.add('done');
};

/* drag-to-scroll the category carousel with a mouse (desktop only) */
function bindCarousels(){
  if(window.matchMedia && window.matchMedia('(pointer:coarse)').matches) return;
  app.querySelectorAll('.cat-slider').forEach(el=>{
    if(el.dataset.dragBound) return;
    el.dataset.dragBound='1';
    let down=false,startX=0,startLeft=0,moved=false;
    el.addEventListener('pointerdown',e=>{
      if(e.pointerType==='touch' || e.button!==0) return;
      down=true; moved=false;
      startX=e.clientX; startLeft=el.scrollLeft;
    });
    el.addEventListener('pointermove',e=>{
      if(!down) return;
      const dx=e.clientX-startX;
      if(!moved && Math.abs(dx)>4){
        moved=true;
        el.classList.add('dragging');
        try{ el.setPointerCapture(e.pointerId); }catch(_){}
      }
      if(moved){ e.preventDefault(); el.scrollLeft=startLeft-dx; }
    });
    const end=()=>{
      if(!down) return;
      down=false;
      el.classList.remove('dragging');
      if(moved){
        const stop=ev=>{ ev.stopPropagation(); ev.preventDefault(); };
        el.addEventListener('click',stop,true);
        setTimeout(()=>el.removeEventListener('click',stop,true),300);
      }
    };
    el.addEventListener('pointerup',end);
    el.addEventListener('pointercancel',end);
    el.addEventListener('pointerleave',end);
  });
}

act.start = ()=>{
  if(S.round>=ROUNDS){ act.again(); return; }
  newRound(); go('pass');
};

act.toReveal  = ()=>{ go('reveal'); bindHold(); };
act.nextReveal = ()=>{
  S.idx++;
  if(S.idx<S.players.length){ go('pass'); }
  else{ S.idx=0; S.r.chaos ? go('chaos') : act.discuss(); }
};
act.discuss = ()=>{ go('chain'); startClock(S.r.trio?180:240); };
act.ask = i =>{
  const target=S.players[i], r=S.r;
  r.asked[target]=(r.asked[target]||0)+1;
  r.lastAsker=r.asker; r.asker=target; r.turns++;
  render();
};
act.toVote = ()=>{ stopClock(); S.idx=0; S.r.votes={}; go('votepass'); };
act.toCast = ()=> go('cast');
act.vote = i =>{
  if(i>=0) S.r.votes[S.players[S.idx]]=S.players[i];
  S.idx++;
  if(S.idx<S.players.length){ go('votepass'); return; }
  finishVote();
};

function finishVote(){
  if(S.r.trio){
    const inn = S.players.filter(p=>p!==S.r.intrus);
    S.r.caught = inn.every(p=>S.r.votes[p]===S.r.intrus);
    S.idx=0; afterJudge(); return;
  }
  const {top} = tallyVotes(S.r.votes);
  if(top.length>1 && !S.tieRound){
    S.r.tied=top; S.tieRound=true; S.idx=0; S.r.votes={};
    go('votepass'); return;
  }
  S.r.caught = top.length===1 && top[0]===S.r.intrus;
  S.idx=0;
  const hasMissions = Object.keys(S.r.missions||{}).length>0;
  if(hasMissions) go('judge'); else afterJudge();
}

act.judge = ok =>{
  S.r.judged[S.players[S.idx]]=ok;
  S.idx++;
  if(S.idx<S.players.length) go('judge'); else afterJudge();
};
function afterJudge(){ go('bonus'); }

act.guessChoice = i=>{
  const w=S.r.bonusChoices[i];
  S.r.guess=norm(w)===norm(S.r.word);
  finish();
};
act.skipGuess = ()=>{ S.r.guess=false; finish(); };

function finish(){ S.r.add=calcScore(); go('result'); }
act.board = ()=> go('board');
act.again = ()=>{
  S.round=0; S.intrusHistory=[]; S.chaosHistory=[];
  S.players.forEach(p=>S.scores[p]=0);
  go('config');
};
act.newGame = ()=>{
  stopClock();
  S.phase='home'; S.players=[]; S.mode='classic'; S.catId=null;
  S.round=0; S.intrusHistory=[]; S.chaosHistory=[]; S.scores={};
  S.r=null; S.idx=0; S.tieRound=false; S.clockLeft=0; S.clockDone=false;
  render();
};

/* ══════════════════════════════════════════════════════════
   HOLD TO REVEAL
══════════════════════════════════════════════════════════ */
function bindHold(){
  const el=document.getElementById('hold'); if(!el) return;
  let t=null, p=0;
  const up = ()=>{
    clearInterval(t); p=0;
    el.style.setProperty('--p',0);
    el.classList.remove('live');
    const ri=document.getElementById('ring');
    if(ri) ri.querySelector('.ring-inner').textContent='🔒';
  };
  const down = e=>{
    e.preventDefault(); clearInterval(t);
    t=setInterval(()=>{
      p=Math.min(100,p+16);
      el.style.setProperty('--p',p);
      const ri=document.getElementById('ring');
      if(ri) ri.querySelector('.ring-inner').textContent=p>=100?'👁️':'🔓';
      if(p>=100) el.classList.add('live');
    },40);
  };
  el.addEventListener('pointerdown',down);
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('pointerleave',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && !document.getElementById('quit-modal').hidden) act.hideQuitModal();
});

document.addEventListener('visibilitychange',()=>{
  if(document.hidden && S.phase==='reveal'){
    const el=document.getElementById('hold');
    if(el){ el.classList.remove('live'); el.style.setProperty('--p',0); }
  }
});

/* ══════════════════════════════════════════════════════════
   UNIT TESTS
   Auto-runs on load. Run manually: runGameTests()
══════════════════════════════════════════════════════════ */
function runGameTests(){
  const failures=[];
  const assert=(name,cond,detail='')=>{if(!cond)failures.push(name+(detail?': '+detail:''));};

  const sv={
    players:[...S.players],catId:S.catId,mode:S.mode,round:S.round,
    intrusHistory:[...S.intrusHistory],chaosHistory:[...S.chaosHistory],
    scores:{...S.scores},r:S.r
  };

  const restore=()=>{
    S.players=sv.players;S.catId=sv.catId;S.mode=sv.mode;S.round=sv.round;
    S.intrusHistory=sv.intrusHistory;S.chaosHistory=sv.chaosHistory;
    S.scores=sv.scores;S.r=sv.r;
  };

  /* ── SUITE 1: intrus selection & role reveal ── */
  S.players=['Ali','Omar','Sara','Ahmed'];
  S.players.forEach(p=>S.scores[p]=0);
  S.catId=null;S.mode='classic';S.round=0;
  S.intrusHistory=[];S.chaosHistory=[];
  const ITER=40;
  for(let i=0;i<ITER;i++){
    newRound();
    const r=S.r;
    /* exactly one intrus */
    assert('[r'+i+'] one intrus',S.players.filter(p=>p===r.intrus).length===1);
    /* intrus is a known player */
    assert('[r'+i+'] intrus is valid player',S.players.includes(r.intrus));
    /* intrus sees "نتا برا السالفة" — simulate reveal logic */
    const intrusSees='نتا برا السالفة';
    assert('[r'+i+'] intrus reveal is static',intrusSees==='نتا برا السالفة');
    /* intrus does NOT see the word */
    assert('[r'+i+'] intrus cannot see word',intrusSees!==r.word,'leaked: '+r.word);
    /* regular players see r.word */
    const regWord=r.word;
    assert('[r'+i+'] regular player sees word',typeof regWord==='string'&&regWord.length>0);
    /* word is from the selected category */
    const cat=CATS.find(c=>c.id===S.catId)||CATS.find(c=>c.n===r.cat)||CATS[0];
    assert('[r'+i+'] word in category',cat.w.map(e=>e[0]).includes(r.word),'word='+r.word);
  }

  /* ── SUITE 2: intrus anti-repeat ── */
  S.players=['Ali','Omar','Sara','Ahmed','Karim'];
  S.players.forEach(p=>S.scores[p]=0);
  S.catId=null;S.mode='classic';S.round=0;S.intrusHistory=[];S.chaosHistory=[];
  const intruses=[];
  for(let i=0;i<20;i++){newRound();intruses.push(S.r.intrus);}
  /* same player cannot be intrus 3 consecutive times */
  for(let i=2;i<intruses.length;i++){
    assert('[anti-repeat '+i+']',
      !(intruses[i]===intruses[i-1]&&intruses[i]===intruses[i-2]),
      intruses[i]+' was intrus 3x in a row');
  }

  /* ── SUITE 3: voting — cannot vote for self ── */
  S.players=['Ali','Omar','Sara'];
  S.players.forEach(p=>S.scores[p]=0);
  S.catId=null;S.mode='classic';S.round=0;S.intrusHistory=[];S.chaosHistory=[];
  newRound();
  /* cast view should filter out self — simulate cast view pool for each player */
  S.players.forEach(me=>{
    const pool=S.players.filter(p=>p!==me);
    assert('[no-self-vote] '+me+' cannot vote for self',!pool.includes(me));
    assert('[no-self-vote] '+me+' has others to vote for',pool.length>0);
  });

  /* ── SUITE 4: scoring — 1pt correct vote, 1pt correct guess ── */
  S.players=['Ali','Omar','Sara','Ahmed'];
  S.players.forEach(p=>S.scores[p]=0);
  S.catId=null;S.mode='classic';S.round=0;S.intrusHistory=[];S.chaosHistory=[];
  newRound();
  const ri=S.r.intrus;
  const nonIntrus=S.players.filter(p=>p!==ri);
  /* all non-intrus vote correctly */
  nonIntrus.forEach(p=>S.r.votes[p]=ri);
  S.r.votes[ri]=nonIntrus[0];
  S.r.caught=true;S.r.guess=true;S.r.judged={};
  const add=calcScore();
  nonIntrus.forEach(p=>assert('[score] '+p+' correct vote = 1',add[p]===1,'got '+add[p]));
  assert('[score] intrus correct guess = 1',add[ri]===1,'got '+add[ri]);
  /* reset scores and test wrong vote */
  S.players.forEach(p=>S.scores[p]=0);
  newRound();
  const ri2=S.r.intrus, ni2=S.players.filter(p=>p!==ri2);
  ni2.forEach(p=>S.r.votes[p]=ni2[0]||p); // vote for non-intrus
  S.r.caught=false;S.r.guess=false;S.r.judged={};
  const add2=calcScore();
  ni2.forEach(p=>assert('[score] wrong vote = 0',add2[p]===0,'got '+add2[p]));
  assert('[score] intrus wrong guess = 0',add2[ri2]===0,'got '+add2[ri2]);

  /* ── SUITE 5: bonus choices ── */
  S.players=['Ali','Omar','Sara','Ahmed'];
  S.players.forEach(p=>S.scores[p]=0);
  S.catId='football';S.mode='classic';S.round=0;S.intrusHistory=[];S.chaosHistory=[];
  newRound();
  const footballCat=CATS.find(c=>c.id==='football');
  const validWords=footballCat.w.map(e=>e[0]);
  /* simulate bonus choices generation */
  const all=footballCat.w.map(e=>e[0]);
  const others=shuffle(all.filter(w=>w!==S.r.word)).slice(0,4);
  const choices=shuffle([S.r.word,...others]);
  assert('[bonus] correct word in choices',choices.includes(S.r.word));
  assert('[bonus] choices count >=2',choices.length>=2,'got '+choices.length);
  assert('[bonus] choices count <=5',choices.length<=5,'got '+choices.length);
  assert('[bonus] all choices from category',choices.every(w=>validWords.includes(w)));
  /* correct selection returns guess=true */
  const correctIdx=choices.indexOf(S.r.word);
  assert('[bonus] correct idx found',correctIdx>=0);
  const normCorrect=norm(choices[correctIdx])===norm(S.r.word);
  assert('[bonus] norm match for correct choice',normCorrect);

  /* ── SUITE 6: football — intrus sees no player name ── */
  S.players=['Ali','Omar','Sara','Ahmed'];
  S.players.forEach(p=>S.scores[p]=0);
  S.catId='football';S.mode='classic';S.round=0;S.intrusHistory=[];S.chaosHistory=[];
  for(let i=0;i<20;i++){
    newRound();
    assert('[⚽ '+i+'] football flag',S.r.football===true);
    assert('[⚽ '+i+'] word is valid player',validWords.includes(S.r.word),S.r.word);
    assert('[⚽ '+i+'] close is null',S.r.close===null||S.r.close===undefined);
  }

  restore();

  const total=failures.length+
    ITER*6+       /* suite 1 */
    18+           /* suite 2 */
    S.players.length*2+ /* suite 3 (after restore players may differ, use rough count) */
    6+            /* suite 4 */
    5+            /* suite 5 */
    20*3;         /* suite 6 */

  if(failures.length){
    console.error('%c🧪 Game Tests: FAILED ('+failures.length+' failures)',
      'color:#FF4500;font-weight:bold;font-size:14px');
    console.group('Failures:');
    failures.forEach(f=>console.error('  ✗ '+f));
    console.groupEnd();
  } else {
    console.log('%c🧪 Game Tests: ALL PASSED ✅',
      'color:#2EFFA8;font-weight:bold;font-size:14px');
  }
  return {failed:failures.length,failures};
}
setTimeout(runGameTests,0);

/* ══════════════════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════════════════ */
render();
</script>
