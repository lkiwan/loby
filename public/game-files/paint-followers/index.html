/* ── Body: dark navy + gold micro-grid ── */
body{
  background:#030812!important;
  background-image:

  color:#f1e7d6!important;
  color-scheme:dark!important;
}
/* Ambient orbs */
body::before,body::after{
  content:""!important;
  position:fixed!important;
  pointer-events:none!important;
  border-radius:50%!important;
  z-index:0!important;
  display:block!important;
}
body::before{
  width:300px!important;height:300px!important;
  top:-130px!important;right:-80px!important;left:auto!important;bottom:auto!important;
  background:radial-gradient(circle,rgba(242,178,61,.12),rgba(242,178,61,0) 65%)!important;
  filter:blur(55px)!important;
}
body::after{
  width:250px!important;height:250px!important;
  bottom:-90px!important;left:-70px!important;top:auto!important;right:auto!important;
  background:radial-gradient(circle,rgba(0,217,255,.10),rgba(0,217,255,0) 65%)!important;
  filter:blur(50px)!important;
}

.home-root,.setup-container,.rr-root,.dr-root,.rs-root{

}

  box-shadow:0 4px 0 rgba(0,0,0,.6)!important;
}
button[class*=border-slate-700]{

}
button[class*=border-slate-700]:active{

}

/* ── CTA buttons: fix text that uses color:var(--paper) on colored bg ── */
