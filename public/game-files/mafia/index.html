    <style>
/* ─── STORE POSTERS THEME (redesign port) ───────────────────
   Unlayered rules: they win over the bundle's @layer styles.
   Flat near-black panels, lime CTA, Store gold, blood red =
   Mafia's accent. Presentation only — bundle JS untouched. */
body{background:#07070D;font-family:'Nunito','Cairo',system-ui,sans-serif;}
.font-grit{font-family:'Nunito','Cairo',sans-serif;font-weight:900;}
.font-darija{font-family:'Nunito','Cairo',sans-serif;}
.bg-night{background-color:#07070D;}
.bg-night-deep{background-color:#0B0B13;}
.bg-night-panel{background-color:#12121C;}
.text-gold{color:#FFC93C;}
.bg-gold{background-color:#FFC93C;}
.border-gold{border-color:#FFC93C;}
.shadow-glowGold{box-shadow:0 0 24px 4px rgba(255,201,60,.35);}
.shadow-glowRed{box-shadow:0 0 24px 4px rgba(255,77,94,.4);}
.shadow-glowGreen{box-shadow:0 0 24px 4px rgba(61,220,132,.4);}
.shadow-card{box-shadow:0 14px 30px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);}
.btn-grit{border-radius:18px;letter-spacing:.01em;}
.btn-gold{background:linear-gradient(180deg,#D9FF6A,#C6F542);color:#131803;box-shadow:0 10px 24px -8px rgba(198,245,66,.45);border-radius:18px;}
.btn-blood{background:linear-gradient(180deg,#FF6B57,#FF4D5E);color:#fff;box-shadow:0 10px 24px -8px rgba(255,77,94,.45);border-radius:18px;}
.btn-ghost{background:#1A1A28;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);border-radius:18px;}
.btn-horror{background:#12121C;border:1px solid rgba(255,77,94,.35);border-radius:18px;box-shadow:0 8px 20px -10px rgba(0,0,0,.6);}
.btn-horror:hover{border-color:rgba(255,77,94,.6);box-shadow:0 8px 20px -10px rgba(0,0,0,.6),0 0 25px rgba(255,77,94,.25);}
.text-horror{
  background:linear-gradient(180deg,#FFFFFF 0%,#FFC9CD 30%,#FF4D5E 62%,#B3122E 100%);
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.9)) drop-shadow(0 0 18px rgba(255,77,94,.35));
}
.wood-table{background-color:#0B0B13;background-image:radial-gradient(ellipse at 50% 40%,rgba(255,201,60,.06),rgba(0,0,0,.5) 70%);}
.wood-frame{border:1px solid rgba(255,255,255,.12);outline:none;box-shadow:inset 0 0 40px rgba(0,0,0,.6),0 18px 50px rgba(0,0,0,.6);}
.grain::after{opacity:.03;}
    </style>
