    <text x="-18" y="-35" font-size="10" fill="#C8900A" font-family="serif">دير</text>
    <line x1="-20" y1="10" x2="20" y2="10" stroke="#C8900A" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Dice on table -->
