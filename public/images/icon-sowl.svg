    <circle cx="-6" cy="-6" r="3.5" fill="#FF4444" opacity="0.9"/>
    <circle cx="6" cy="-6" r="3.5" fill="#FF4444" opacity="0.9"/>
    <circle cx="-6" cy="6" r="3.5" fill="#FF4444" opacity="0.9"/>
    <circle cx="6" cy="6" r="3.5" fill="#FF4444" opacity="0.9"/>
  </g>
  <g transform="translate(245,348)" filter="url(#fSoft)">
    <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#1A0800"/>
    <rect x="-14" y="-14" width="28" height="28" rx="4" fill="none" stroke="#C8900A" stroke-width="1.5"/>
    <circle cx="0" cy="-4" r="3" fill="#FF8833" opacity="0.9"/>
    <circle cx="-5" cy="5" r="3" fill="#FF8833" opacity="0.9"/>
    <circle cx="5" cy="5" r="3" fill="#FF8833" opacity="0.9"/>
  </g>

  <ellipse cx="200" cy="375" rx="155" ry="20" fill="#0A0100" opacity="0.9"/>
