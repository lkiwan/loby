    <path d="M -32,-90 Q -46,-75 -46,-60 Q -46,-45 -32,-30" fill="none" stroke="#FF4444" stroke-width="2.5" opacity="0.7" stroke-linecap="round"/>
    <path d="M -40,-100 Q -58,-80 -58,-60 Q -58,-40 -40,-20" fill="none" stroke="#FF4444" stroke-width="1.8" opacity="0.45" stroke-linecap="round"/>
