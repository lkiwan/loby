  <circle cx="268" cy="158" r="5" fill="#99DDFF" opacity="0.6"/>
  <circle cx="276" cy="166" r="4" fill="#33AAFF" opacity="0.5"/>

  <circle cx="140" cy="280" r="8" fill="#33CC66" opacity="0.65" filter="url(#fSoft)"/>
  <circle cx="260" cy="285" r="7" fill="#FFAA00" opacity="0.65" filter="url(#fSoft)"/>
  <circle cx="150" cy="310" r="6" fill="#9933FF" opacity="0.55"/>
  <circle cx="250" cy="305" r="5" fill="#FF6633" opacity="0.55"/>

