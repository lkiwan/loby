<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#5A3A00"/>
    <stop offset="22%"  stop-color="#C8900A"/>
    <stop offset="45%"  stop-color="#F5D060"/>
    <stop offset="55%"  stop-color="#FFE580"/>
    <stop offset="78%"  stop-color="#C8900A"/>
    <stop offset="100%" stop-color="#5A3A00"/>
  </linearGradient>
  <linearGradient id="gGoldV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#F5D060"/>
    <stop offset="50%"  stop-color="#C8900A"/>
    <stop offset="100%" stop-color="#7A5500"/>
  </linearGradient>
  <clipPath id="aClip">
    <path d="M 44,400 L 44,232 C 44,102 130,38 200,38 C 270,38 356,102 356,232 L 356,400 Z"/>
  </clipPath>
  <filter id="fGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fSoft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fBlur5"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="fBlur10"><feGaussianBlur stdDeviation="10"/></filter>
  <radialGradient id="gBg" cx="50%" cy="42%" r="68%">
    <stop offset="0%"   stop-color="#1A0A00"/>
    <stop offset="50%"  stop-color="#0C0502"/>
    <stop offset="100%" stop-color="#060200"/>
  </radialGradient>
  <radialGradient id="gCenter" cx="50%" cy="48%" r="55%">
    <stop offset="0%"   stop-color="#F97066" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#F97066" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gPalette" cx="40%" cy="40%" r="55%">
    <stop offset="0%"   stop-color="#FFF8E8"/>
    <stop offset="40%"  stop-color="#F5DDB0"/>
    <stop offset="100%" stop-color="#D4A050"/>
  </radialGradient>
  <pattern id="zel" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
    <polygon points="11,0 22,11 11,22 0,11" fill="none" stroke="#3A1A00" stroke-width="0.6" opacity="0.38"/>
    <polygon points="11,4 18,11 11,18 4,11" fill="none" stroke="#3A1A00" stroke-width="0.4" opacity="0.22"/>
  </pattern>
</defs>

